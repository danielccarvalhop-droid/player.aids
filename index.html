<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Game Companion</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            900: '#0f0f0f', // Preto profundo
                            850: '#1a1a1a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        /* Efeito sutil de brilho no hover */
        .glass-effect {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white flex flex-col items-center"
      x-data="{ loaded: false }"
      x-init="setTimeout(() => loaded = true, 100)">

    <!-- Container Principal -->
    <main class="w-full max-w-lg md:max-w-3xl px-6 py-8 md:py-12 transition-all duration-700 ease-out"
          :class="loaded ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'">

        <!-- Header -->
        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center p-3 mb-4 bg-gray-850 rounded-2xl border border-gray-800 shadow-2xl ring-1 ring-white/5">
                <i data-lucide="layout-grid" class="w-6 h-6 text-indigo-400"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2">
                Game Hub
            </h1>
            <p class="text-gray-500 text-sm font-medium uppercase tracking-widest">Selecione sua sessão</p>
        </header>

        <!-- Grid de Jogos (Apenas 2 Itens) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">

            <!-- Card 1: Brass Birmingham -->
            <!-- Link aponta para a pasta ./brass_birmingham/ e busca a imagem lá dentro -->
            <a href="./brass_birmingham/" class="group relative block w-full aspect-[3/4] md:aspect-[4/5] rounded-3xl overflow-hidden bg-gray-800 shadow-2xl ring-1 ring-white/10 transition-transform duration-300 hover:-translate-y-1">
                
                <!-- Imagem: Agora busca dentro da pasta do jogo -->
                <div class="absolute inset-0">
                    <img src="./brass_birmingham/brass.png" 
                         alt="Brass Birmingham Theme" 
                         class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-60 group-hover:opacity-70">
                    <!-- Overlay Gradiente -->
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
                </div>

                <!-- Conteúdo -->
                <div class="absolute inset-0 p-6 flex flex-col justify-end">
                    <div class="transform transition-transform duration-300 group-hover:translate-y-[-4px]">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2 py-1 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 uppercase tracking-wide">
                                Econômico
                            </span>
                        </div>
                        <h2 class="text-3xl font-bold text-white leading-none mb-1">Brass</h2>
                        <h3 class="text-xl font-light text-gray-300">Birmingham</h3>
                    </div>

                    <!-- Botão Flutuante -->
                    <div class="mt-6 flex items-center justify-between border-t border-white/10 pt-4 opacity-80 group-hover:opacity-100 transition-opacity">
                        <span class="text-sm text-gray-400 group-hover:text-white transition-colors">Abrir painel</span>
                        <div class="bg-white/10 p-2 rounded-full group-hover:bg-amber-500 group-hover:text-black transition-all duration-300">
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            </a>

            <!-- Card 2: Ark Nova -->
            <!-- Link aponta para a pasta ./ark_nova/ e busca a imagem lá dentro -->
            <a href="./ark_nova/" class="group relative block w-full aspect-[3/4] md:aspect-[4/5] rounded-3xl overflow-hidden bg-gray-800 shadow-2xl ring-1 ring-white/10 transition-transform duration-300 hover:-translate-y-1">
                
                <!-- Imagem: Agora busca dentro da pasta do jogo -->
                <div class="absolute inset-0">
                    <img src="./ark_nova/ark.png" 
                         alt="Ark Nova Theme" 
                         class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-60 group-hover:opacity-70">
                    <!-- Overlay Gradiente -->
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
                </div>

                <!-- Conteúdo -->
                <div class="absolute inset-0 p-6 flex flex-col justify-end">
                    <div class="transform transition-transform duration-300 group-hover:translate-y-[-4px]">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2 py-1 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 uppercase tracking-wide">
                                Zoo Builder
                            </span>
                        </div>
                        <h2 class="text-3xl font-bold text-white leading-none mb-1">Ark</h2>
                        <h3 class="text-xl font-light text-gray-300">Nova</h3>
                    </div>

                    <!-- Botão Flutuante -->
                    <div class="mt-6 flex items-center justify-between border-t border-white/10 pt-4 opacity-80 group-hover:opacity-100 transition-opacity">
                        <span class="text-sm text-gray-400 group-hover:text-white transition-colors">Abrir painel</span>
                        <div class="bg-white/10 p-2 rounded-full group-hover:bg-emerald-500 group-hover:text-black transition-all duration-300">
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            </a>

        </div>

        <footer class="mt-12 text-center text-gray-600 text-xs">
            <p>&copy; 2024 Board Game Companion</p>
        </footer>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
