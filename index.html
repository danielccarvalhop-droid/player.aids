<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Board Game Companion</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            900: '#0f0f0f', // Preto profundo (OLED friendly)
                            850: '#1a1a1a',
                        }
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* Remove o highlight azul ao tocar em botões no mobile */
        body { 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
        }
        
        /* Previne flash de conteúdo não estilizado (FOUC) do Alpine */
        [x-cloak] { display: none !important; }

        /* Efeito Glassmorphism Otimizado */
        .glass-effect {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-[100dvh] antialiased selection:bg-indigo-500 selection:text-white flex flex-col items-center overflow-x-hidden"
      x-data="{ loaded: false }"
      x-init="setTimeout(() => loaded = true, 50)">

    <main x-cloak 
          class="w-full max-w-lg md:max-w-3xl px-5 py-6 md:py-12 transition-all duration-700 ease-out"
          :class="loaded ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'">

        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 mb-3 bg-gray-850 rounded-2xl border border-gray-800 shadow-2xl ring-1 ring-white/5">
                <i data-lucide="layout-grid" class="w-6 h-6 text-indigo-400"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-1">
                Game Hub
            </h1>
            <p class="text-gray-500 text-xs md:text-sm font-medium uppercase tracking-widest">Selecione sua sessão</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full pb-10">

            <a href="./brass_birmingham/" class="group relative block w-full aspect-[4/5] rounded-3xl overflow-hidden bg-gray-800 shadow-xl ring-1 ring-white/10 active:scale-[0.98] transition-all duration-200">
                
                <div class="absolute inset-0">
                    <img src="./brass_birmingham/brass.png" 
                         alt="Brass Birmingham Theme" 
                         class="w-full h-full object-cover opacity-60 transition-transform duration-700 group-hover:scale-105">
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
                </div>

                <div class="absolute inset-0 p-6 flex flex-col justify-end">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2 py-1 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 uppercase tracking-wide backdrop-blur-sm">
                                Econômico
                            </span>
                        </div>
                        <h2 class="text-3xl font-bold text-white leading-none mb-1 shadow-black drop-shadow-lg">Brass</h2>
                        <h3 class="text-xl font-light text-gray-300 shadow-black drop-shadow-md">Birmingham</h3>
                    </div>

                    <div class="mt-5 flex items-center justify-between border-t border-white/10 pt-4">
                        <span class="text-sm text-gray-300 font-medium">Acessar Guia</span>
                        <div class="bg-white/10 p-2 rounded-full text-white group-hover:bg-amber-500 group-hover:text-black transition-colors duration-300">
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            </a>

            <a href="./ark_nova/" class="group relative block w-full aspect-[4/5] rounded-3xl overflow-hidden bg-gray-800 shadow-xl ring-1 ring-white/10 active:scale-[0.98] transition-all duration-200">
                
                <div class="absolute inset-0">
                    <img src="./ark_nova/ark.png" 
                         alt="Ark Nova Theme" 
                         class="w-full h-full object-cover opacity-60 transition-transform duration-700 group-hover:scale-105">
                    <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
                </div>

                <div class="absolute inset-0 p-6 flex flex-col justify-end">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2 py-1 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 uppercase tracking-wide backdrop-blur-sm">
                                Zoo Builder
                            </span>
                        </div>
                        <h2 class="text-3xl font-bold text-white leading-none mb-1 shadow-black drop-shadow-lg">Ark</h2>
                        <h3 class="text-xl font-light text-gray-300 shadow-black drop-shadow-md">Nova</h3>
                    </div>

                    <div class="mt-5 flex items-center justify-between border-t border-white/10 pt-4">
                        <span class="text-sm text-gray-300 font-medium">Acessar Guia</span>
                        <div class="bg-white/10 p-2 rounded-full text-white group-hover:bg-emerald-500 group-hover:text-black transition-colors duration-300">
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            </a>

        </div>

        <footer class="mt-4 text-center text-gray-600 text-[10px] uppercase tracking-wider pb-6">
            <p>&copy; 2024 Board Game Companion</p>
        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // Inicializa ícones
        lucide.createIcons();
    </script>
</body>
</html>
